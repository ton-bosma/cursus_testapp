<article class="types-page">

  <!-- ── Masthead ─────────────────────────────────────────────── -->
  <header class="ledger-head">
    <p class="ledger-head__meta">{{ pageMeta }}</p>
    <div class="ledger-head__row">
      <h1 class="ledger-head__title">
        {{ labels.instrumenttype.title }}<span class="ledger-head__title-mark"></span>
      </h1>
    </div>
    <div class="ledger-rule ledger-rule--double"></div>
  </header>

  <!-- ── Inline edit table ─────────────────────────────────────── -->
  <table mat-table [dataSource]="visibleRows()" class="inline-table">

    <!-- Omschrijving column -->
    <ng-container matColumnDef="omschrijving">
      <th mat-header-cell *matHeaderCellDef>{{ labels.instrumenttype.colOmschrijving }}</th>
      <td mat-cell *matCellDef="let row">
        <input class="ledger-input"
               [(ngModel)]="row.omschrijving"
               [disabled]="row.markedDeleted"
               [attr.aria-label]="labels.instrumenttype.colOmschrijving" />
      </td>
    </ng-container>

    <!-- Forfait accessoires column -->
    <ng-container matColumnDef="forfaitAccessoires">
      <th mat-header-cell *matHeaderCellDef class="head--num">
        {{ labels.instrumenttype.colForfaitAccessoires }}
      </th>
      <td mat-cell *matCellDef="let row" class="cell--num">
        <input class="ledger-input ledger-input--num"
               type="number"
               step="0.01"
               [(ngModel)]="row.forfaitAccessoires"
               [disabled]="row.markedDeleted"
               [attr.aria-label]="labels.instrumenttype.colForfaitAccessoires" />
      </td>
    </ng-container>

    <!-- Actions column -->
    <ng-container matColumnDef="acties">
      <th mat-header-cell *matHeaderCellDef class="head--act"></th>
      <td mat-cell *matCellDef="let row" class="cell--act">
        <button mat-icon-button
                color="warn"
                (click)="deleteRow(row)"
                [attr.aria-label]="labels.instrumenttype.btnVerwijderen">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        [class.row--deleted]="row.markedDeleted"></tr>
  </table>

  <!-- ── Toolbar ───────────────────────────────────────────────── -->
  <div class="toolbar">
    <button mat-stroked-button (click)="addRow()">
      {{ labels.instrumenttype.btnRijToevoegen }}
    </button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
      {{ labels.instrumenttype.btnOpslaan }}
    </button>
  </div>

</article>
