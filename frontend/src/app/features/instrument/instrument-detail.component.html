@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<header class="ledger-head detail-head">
  <p class="ledger-head__meta">{{ metaLine }}</p>
  <div class="ledger-head__row">
    <h1 class="ledger-head__title">
      {{ title() }}<span class="ledger-head__title-mark"></span>
    </h1>
  </div>
  <div class="ledger-rule ledger-rule--double"></div>
</header>

<form class="detail" [formGroup]="form" (ngSubmit)="save()">
  <mat-accordion multi>
    <!-- Panel: In -->
    <mat-expansion-panel expanded>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <span class="ledger-label">{{ labels.panelIn }}</span>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="fields">
        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.datumIn }}</span>
          <input class="ledger-input" type="date" formControlName="datumIn" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.inkoopbron }}</span>
          <select class="ledger-input" formControlName="idInkoopbron">
            <option [ngValue]="null">—</option>
            @for (bron of bronnen(); track bron.id) {
              <option [ngValue]="bron.id">{{ bron.omschrijving }}</option>
            }
          </select>
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.aanschafnr }}</span>
          <input class="ledger-input" type="text" formControlName="aanschafnr" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.huurnr }}</span>
          <input class="ledger-input ledger-input--num" type="number" formControlName="huurnr" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.inkoopFactuur }}</span>
          <input class="ledger-input" type="text" formControlName="inkoopFactuur" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.inkoopInstr }}</span>
          <input
            class="ledger-input ledger-input--num"
            type="text"
            inputmode="decimal"
            appCurrency
            formControlName="inkoopInstr"
          />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.inkoopAcc }}</span>
          <input
            class="ledger-input ledger-input--num"
            type="text"
            inputmode="decimal"
            appCurrency
            formControlName="inkoopAcc"
          />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.idAdresIn }}</span>
          <input class="ledger-input ledger-input--num" type="number" formControlName="idAdresIn" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.idAdresTaxateur }}</span>
          <input class="ledger-input ledger-input--num" type="number" formControlName="idAdresTaxateur" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.datumTaxatie }}</span>
          <input class="ledger-input" type="date" formControlName="datumTaxatie" />
        </label>
      </div>

      <div class="panel-actions">
        <button type="button" mat-stroked-button (click)="generateAanschafnr()">
          {{ labels.btnGenereerAanschafnr }}
        </button>
        <button type="button" mat-stroked-button (click)="generateHuurnr()">
          {{ labels.btnGenereerHuurnr }}
        </button>
      </div>
    </mat-expansion-panel>

    <!-- Panel: Uit -->
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <span class="ledger-label">{{ labels.panelUit }}</span>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="fields">
        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.datumUit }}</span>
          <input class="ledger-input" type="date" formControlName="datumUit" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.verkoopInstr }}</span>
          <input
            class="ledger-input ledger-input--num"
            type="text"
            inputmode="decimal"
            appCurrency
            formControlName="verkoopInstr"
          />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.idAdresUit }}</span>
          <input class="ledger-input ledger-input--num" type="number" formControlName="idAdresUit" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.verkoopBtw }}</span>
          <input
            class="ledger-input ledger-input--num"
            type="text"
            inputmode="decimal"
            appCurrency
            formControlName="verkoopBtw"
          />
        </label>
      </div>
    </mat-expansion-panel>

    <!-- Panel: Instrument -->
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <span class="ledger-label">{{ labels.panelInstrument }}</span>
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="fields">
        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.type }}</span>
          <select class="ledger-input" formControlName="idInstrType">
            <option [ngValue]="null">—</option>
            @for (type of types(); track type.id) {
              <option [ngValue]="type.id">{{ type.omschrijving }}</option>
            }
          </select>
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.maat }}</span>
          <input class="ledger-input" type="text" formControlName="maat" />
        </label>

        <label class="ledger-field">
          <span class="ledger-field__label">{{ labels.velden.anno }}</span>
          <input class="ledger-input ledger-input--num" type="number" formControlName="anno" />
        </label>

        <label class="ledger-field ledger-field--inline">
          <input type="checkbox" formControlName="antique" />
          <span class="ledger-field__label">{{ labels.velden.antique }}</span>
        </label>

        <label class="ledger-field full-width">
          <span class="ledger-field__label">{{ labels.velden.omschrijving }}</span>
          <textarea class="ledger-input" rows="3" formControlName="omschrijvIn"></textarea>
        </label>

        <label class="ledger-field full-width">
          <span class="ledger-field__label">{{ labels.velden.reparaties }}</span>
          <textarea class="ledger-input" rows="2" formControlName="reparaties"></textarea>
        </label>
      </div>
    </mat-expansion-panel>
  </mat-accordion>

  <div class="form-actions">
    <button type="submit" mat-flat-button color="primary" [disabled]="saving()">
      {{ labels.btnOpslaan }}
    </button>
    @if (nested) {
      <button
        type="button"
        mat-button
        class="action-delete"
        [disabled]="currentId() === undefined"
        (click)="delete()"
      >
        {{ labels.btnVerwijderen }}
      </button>
    }
  </div>
</form>
