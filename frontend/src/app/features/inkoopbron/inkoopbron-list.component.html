<article class="inkoopbron-page">

  <!-- ── Masthead ────────────────────────────────────────────── -->
  <header class="ledger-head">
    <p class="ledger-head__meta">Onderhoud · Inkoopbron</p>
    <div class="ledger-head__row">
      <h1 class="ledger-head__title">
        {{ labels.inkoopbron.title }}<span class="ledger-head__title-mark"></span>
      </h1>
    </div>
    <div class="ledger-rule ledger-rule--double"></div>
  </header>

  <!-- ── Inline editor table ──────────────────────────────────── -->
  <table mat-table [dataSource]="visibleRows()" class="inline-table">

    <!-- Omschrijving column -->
    <ng-container matColumnDef="omschrijving">
      <th mat-header-cell *matHeaderCellDef>{{ labels.inkoopbron.colOmschrijving }}</th>
      <td mat-cell *matCellDef="let row">
        <mat-form-field appearance="outline" class="cell-field">
          <input matInput
                 [(ngModel)]="row.omschrijving"
                 [disabled]="row.markedDeleted"
                 [attr.aria-label]="labels.inkoopbron.colOmschrijving" />
        </mat-form-field>
      </td>
    </ng-container>

    <!-- Rapporteren column -->
    <ng-container matColumnDef="rapporteren">
      <th mat-header-cell *matHeaderCellDef>{{ labels.inkoopbron.colRapporteren }}</th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox [(ngModel)]="row.rapporteren"
                      [disabled]="row.markedDeleted"
                      [attr.aria-label]="labels.inkoopbron.colRapporteren">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Actions column -->
    <ng-container matColumnDef="acties">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button
                color="warn"
                (click)="deleteRow(row)"
                [attr.aria-label]="labels.inkoopbron.btnVerwijderen">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        [class.deleted-row]="row.markedDeleted"></tr>
  </table>

  <!-- ── Toolbar ───────────────────────────────────────────────── -->
  <div class="toolbar">
    <button mat-stroked-button (click)="addRow()">
      {{ labels.inkoopbron.btnRijToevoegen }}
    </button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
      {{ labels.inkoopbron.btnOpslaan }}
    </button>
  </div>

</article>
