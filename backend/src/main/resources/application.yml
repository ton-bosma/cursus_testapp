server:
  port: 8080

spring:
  application:
    name: viool

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viool}
    username: ${DB_USERNAME:viool}
    password: ${DB_PASSWORD:viool}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jooq:
    sql-dialect: POSTGRES

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
